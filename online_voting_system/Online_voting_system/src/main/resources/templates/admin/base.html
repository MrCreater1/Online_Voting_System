
<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">

    <title th:text="${title}">Online Voting</title>

</head>

<body>

<!-- Navbar -->

<nav class="admin-navbar">

    <div class="admin-navbar-left">

        <a th:href="@{/admin/}"
           class="admin-logo">
            Online Voting
        </a>

    </div>


    <div class="admin-navbar-right">

        <a th:href="@{/admin/}">
            Home
        </a>

        <a th:href="@{/admin/about}">
            About
        </a>

        <span>
                Welcome Admin
            </span>

        <a th:href="@{/logout}"
           class="admin-logout">
            Logout
        </a>

    </div>

</nav>

<!-- Navbar End -->


<!-- Page Content -->

<div th:replace="${content}">
</div>

</body>

</html>
